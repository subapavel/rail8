name: mapping-ci

# The mapping engine's checks (mapping/): build with unit tests, licences and bans and the script tests, run by
# ci/check mapping in mapping/ with the repository's wrapper. The mapping studio is part of the Rail8 UI (ui/), which
# ui-ci.yml checks.
# It runs once a day on main, before the owner's morning overview, and on demand. It has no pull request trigger; the
# session that wrote a change runs ci/check mapping before it merges. A push to main also runs it when the mapping, the
# root pom, the wrapper, the root .gitattributes, .java-version, ci/check, this file or mapping-nightly.yml changes,
# because the coverage ratchet of mapping-nightly.yml reads the push runs of the backend job. The UI's end-to-end tests, coverage floors, the ratchet,
# mutation testing and the Windows build run only on demand in mapping-nightly.yml. The platform's ci.yml checks the
# sign-off of every commit.
on:
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mapping/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw*'
      - '.gitattributes'
      - '.java-version'
      - 'ci/check'
      - '.github/workflows/mapping-ci.yml'
      - '.github/workflows/mapping-nightly.yml'

concurrency:
  group: mapping-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Central rate-limits shared IPs; the Google mirror of Central serves the same artefacts (ADR-0017).
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  backend:
    # The nightly coverage job (mapping-nightly.yml) takes as its baseline the closest earlier commit whose push run
    # of this job was green; scripts/ratchet-baseline.sh finds it by this name, so renaming the job renames the key.
    name: mapping · backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: 'mapping/**/pom.xml'
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: Script tests, build, test, licences, bans, the LF checkout check (ci/check mapping)
        run: ci/check mapping
