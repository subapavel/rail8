name: ui-ci

# The Rail8 web application (ui/): licences of every npm package, the generated types, type check, lint, unit tests,
# component tests in Chromium and the production build, and the end-to-end scenarios against the quickstart's node.
# Each job runs an area of ci/check. It runs once a day on main, before the owner's morning overview, and on demand; it
# has no pull request trigger, and the session that wrote a change runs the same areas before it merges.
on:
  schedule:
    - cron: '42 4 * * *'
  workflow_dispatch:

concurrency:
  group: ui-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Central rate-limits shared IPs; the Google mirror of Central serves the same artefacts.
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  ui:
    name: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Licences, generated types, typecheck, lint, unit and browser tests, the production build (ci/check ui)
        run: ci/check ui

  # The quickstart's node started by docker compose, and the @stack scenarios of the UI against it: the development
  # server answers the studio's /api over a copy of the corpus and calls the node.
  stack:
    name: ui · stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <mirrors>
              <mirror>
                <id>google-maven-central</id>
                <mirrorOf>central</mirrorOf>
                <url>https://maven-central.storage-download.googleapis.com/maven2</url>
              </mirror>
            </mirrors>
          </settings>
          EOF
      - name: The node started afresh, the @stack scenarios against it (ci/check ui-stack)
        run: ci/check ui-stack
