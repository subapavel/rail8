# A file dropped in the SFTP inbox, the same transformation at least once: the file is deleted after the durable save (the consumer's
# job), the invoice is sent to the domestic partner through the Postgres work queue; a partner that keeps failing parks it in the DLQ after
# one scheduled retry of the run, 1 s later (delivery.retries). It names the connections of two systems, billing/sftp and acme/erp/rest
# (systems/), whose values each environment holds; the flow holds only its own settings.
schemaVersion: 2
kind: flow
id: sftp-invoice
version: 0.1.0
description: Validate an invoice file from the SFTP inbox, map it for the partner and send it on.
from:
  adapter: sftp
  connection: billing/sftp
  settings: { dir: /inbox, afterSuccess: delete }
delivery:
  mode: at-least-once
  saveTimeout: 5s
  retries: { count: 1, interval: 1s }
  queue: postgres
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
  maxInFlight: 16
  maxInFlightBytes: 16777216
partitionBy: invoiceId
retry:
  attempts: 3
  initial: 100ms
  max: 2s
steps:
  - type: xsd
    name: validate
    schema: flows/invoice.xsd
  - type: extractKey
    name: extractKey
    key: invoiceId
    xpath: /Invoice/Id
  - type: xslt
    name: toPartner
    stylesheet: flows/invoice-to-partner.xsl
  - type: to
    name: partner
    retryable: true
    adapter: http
    connection: acme/erp/rest
    settings: { path: /invoices }
