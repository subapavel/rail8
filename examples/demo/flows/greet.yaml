# Maps a JSON person to an XML greeting with the mapping of the studio mappings/greeting.mapping.json and answers with
# the greeting, so a change of the mapping shows in the reply once it is deployed.
schemaVersion: 1
kind: flow
id: greet
version: 0.1.0
description: Greet a person with a mapping of the studio.
from:
  endpoint: http-in-greet
delivery:
  mode: sync
recording:
  level: all
  payload: keep
limits:
  maxBodyBytes: 1048576
steps:
  - type: mapping
    name: greeting
    mapping: mappings/greeting.mapping.json
