# The gate stack, the demo the platform is accepted on: Postgres, Valkey and an SFTP server beside one Rail8 node,
# the demo's partner echo and a one-shot that deploys examples/demo as committed at the checkout's HEAD; a one-shot (sftp-keys) makes the SFTP host key first. A demo stack,
# not production: the node runs RAIL8_ENV=dev so the manual deploy and the file:// package repository are allowed. Kafka is the optional event-broker add-on, off by default: start it with --profile kafka; ClickHouse (--profile history) is present, not wired.
# Build the host jars first, from the repository's root: ./mvnw -B -ntp -q package -DskipTests -pl :rail8-node,:rail8-cli -am
# Then, with the secret store's key exported as RAIL8_SECRETS_KEY:  RAIL8_ADMIN_TOKEN=$(bin/rail8 key new) docker compose up -d --build   (see README.md)
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: rail8
      POSTGRES_USER: rail8
      POSTGRES_PASSWORD: ${RAIL8_PG_PASSWORD:-rail8}
    volumes:
      # the 18 image keeps PGDATA at /var/lib/postgresql/18/docker and refuses a mount at .../data; a 17 volume is not reused
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail8 -d rail8"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.11
    # persistence off: Valkey holds tempo state only
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    # the optional event-broker add-on (O-1): KRaft, one node, not wired to the node; started only with --profile kafka
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  sftp-keys:
    # one-shot: generates the SFTP server's RSA host key (3072 bits) into the sftp-hostkeys volume, only when it is not there yet (a
    # second `up` keeps the key the server already presented), and writes the SHA256 fingerprint of its public half, which is public,
    # to host-key.fingerprint in the separate volume sftp-fingerprint: the node mounts only that one, read-only, and reads the file as
    # RAIL8_SECRET_SFTP_HOST_KEY_FILE; no path holding a host key reaches it. It exits non-zero when the fingerprint file is empty. RSA
    # because the node's SFTP client (Apache MINA SSHD 2.20 as shipped) does not offer ssh-ed25519 (observed, P2-06). Same pinned
    # image as `sftp` (it ships ssh-keygen).
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    restart: "no"
    volumes:
      - sftp-hostkeys:/keys
      - sftp-fingerprint:/fingerprint
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /keys/ssh_host_rsa_key ]; then ssh-keygen -q -t rsa -b 3072 -N '' -f /keys/ssh_host_rsa_key; fi
        ssh-keygen -l -f /keys/ssh_host_rsa_key.pub | awk '{print $$2}' > /fingerprint/host-key.fingerprint
        chmod 644 /fingerprint/host-key.fingerprint
        [ -s /fingerprint/host-key.fingerprint ]

  sftp:
    # user demo, directory inbox. The host key is the RSA one `sftp-keys` generated: only the key file is mounted (a volume over
    # /etc/ssh would shadow the image's sshd_config); the image makes its own ed25519 key, which the node's client never negotiates. The wrapper hands the inbox volume (root-owned when mounted) to the user demo,
    # uid 1001, so that it can delete a delivered file. README: how to drop a file, the fingerprint.
    # The tag is a moving one upstream, so the image is pinned by digest.
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    entrypoint:
      - sh
      - -c
      - 'chown 1001:100 /home/demo/inbox && exec /entrypoint "$$@"'
      - sftp
    command: ["demo:${RAIL8_SFTP_PASSWORD:-demo}:1001:100:inbox"]
    volumes:
      - type: volume
        source: sftp-hostkeys
        target: /etc/ssh/ssh_host_rsa_key
        read_only: true
        volume:
          subpath: ssh_host_rsa_key
      - sftp-data:/home/demo/inbox
    depends_on:
      sftp-keys:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 30

  netns:
    # holds the network namespace of the node and the echo: either can die and come back without the other losing localhost
    image: eclipse-temurin:25.0.4.1_1-jre-noble
    command: ["sleep", "infinity"]
    networks:
      default:
        aliases:
          - rail8
    ports:
      - "127.0.0.1:8080:8080"   # the node's HTTP port: every inbound HTTP endpoint (/http/in, /http/invoice/async, /http/order)
      - "127.0.0.1:8081:8081"   # admin API and /health
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 2s
      retries: 30

  rail8:
    network_mode: "service:netns"
    build:
      context: ../..
      dockerfile: deploy/quickstart/Dockerfile
    image: rail8-stack:local
    environment:
      RAIL8_ENV: dev
      RAIL8_NODE_ID: stack
      # the body journal's master key, generated once into <data dir>/journal/MASTER beside the data it protects: a dev stack of
      # one node only; the node logs a WARNING about it at every start (D-106). Any other node takes RAIL8_JOURNAL_KEY_FILE
      RAIL8_JOURNAL_KEY_GENERATE: "true"
      RAIL8_PG_HOST: postgres
      RAIL8_PG_PASSWORD: ${RAIL8_PG_PASSWORD:-rail8}
      # the stack's own network reaches Postgres as 'postgres', which defaults to verify-full: this dev stack's Postgres serves no
      # TLS, so its plaintext link is written down here (D-124); a deployed node sets verify-full and RAIL8_PG_SSL_ROOT_CERT
      RAIL8_PG_SSL_MODE: disable
      RAIL8_VALKEY_URI: redis://valkey:6379
      # the node's HTTP port, shared by every inbound HTTP endpoint, listens on the container's network as the admin API does
      RAIL8_HTTP_HOST: 0.0.0.0
      # the URL senders call that port at, through the port published above; the UI shows it before each endpoint's path
      RAIL8_HTTP_ORIGIN: http://localhost:8080
      RAIL8_ADMIN_HOST: 0.0.0.0
      # the emergency key (`rail8 key new`): it makes the first users and acts on users only
      RAIL8_ADMIN_TOKEN: "${RAIL8_ADMIN_TOKEN:?set RAIL8_ADMIN_TOKEN to a key from rail8 key new: the admin API on 0.0.0.0 needs one}"
      # plain HTTP on 0.0.0.0, stated: the admin port is published on the host's loopback only, and the stack's network is this
      # host's own; the node logs a WARNING at its start. A node other hosts reach gets RAIL8_ADMIN_TLS_CERT and RAIL8_ADMIN_TLS_KEY
      RAIL8_ADMIN_TLS: "off"
      # the secret store's key, which seals every secret in Postgres: the base64 of 256 random bits, made once and kept apart from
      # the database and its backups (README.md, "The secret store"); the node refuses to start without it
      RAIL8_SECRETS_KEY: "${RAIL8_SECRETS_KEY:?set RAIL8_SECRETS_KEY to the secret store's key, the content of ~/.rail8-stack-secrets-key (made once as README.md says); to remove the stack without it: RAIL8_SECRETS_KEY=x docker compose down -v}"
      # the demo's sftp-inbox names both as secret:// references; the host key's fingerprint is a secret given as a file, the
      # file `sftp-keys` wrote (public, unknown until the key exists). The node's first start imports both into the secret store,
      # once: a later change of either is not read
      RAIL8_SECRET_SFTP_PASSWORD: "${RAIL8_SFTP_PASSWORD:-demo}"
      RAIL8_SECRET_SFTP_HOST_KEY_FILE: /sftp-fingerprint/host-key.fingerprint
      # the package repositories: this Rail8 checkout, mounted below as the repository `rail8`, whose package is examples/demo;
      # a deploy reads its commits, so the checkout needs its full history (no shallow clone, no worktree)
      RAIL8_GIT_BASE: file:///repos/
      RAIL8_GIT_PATH: examples/demo
    volumes:
      - sftp-fingerprint:/sftp-fingerprint:ro
      # the node's data directory (the body journal with its NODE, segments and generated MASTER, the git cache and the packages'
      # directories) is a named volume: a recreated container finds its journal again; `docker compose down -v` removes it together
      # with pg-data
      - rail8-data:/var/lib/rail8
      - ../..:/repos/rail8:ro
    depends_on:
      netns:
        condition: service_healthy
      sftp-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # the image's script: GET /health on the admin port, over HTTPS when RAIL8_ADMIN_TLS_CERT is set; healthy on a 200
      test: ["CMD", "/opt/rail8/health.sh"]
      interval: 2s
      timeout: 2s
      retries: 30

  echo:
    # the demo's partner on localhost:8090 of the node (the node's network namespace)
    image: eclipse-temurin:25.0.4.1_1-jdk-noble
    user: ubuntu
    network_mode: "service:netns"
    volumes:
      - ../quickstart/PartnerEcho.java:/opt/echo/PartnerEcho.java:ro
    command: ["java", "/opt/echo/PartnerEcho.java", "8090"]
    depends_on:
      netns:
        condition: service_healthy
      rail8:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 2s
      timeout: 2s
      retries: 30

  deploy:
    # one-shot, in the profile `deploy`: `rail8 deploy rail8 HEAD` with the host-built CLI jar, then exit 0 (no healthcheck, no
    # restart): the node deploys examples/demo as committed at the checkout's HEAD. It sends RAIL8_TOKEN, the token of a developer's
    # account that `rail8 bootstrap` writes once the node runs, so it is started after that: `docker compose run --rm deploy`. The
    # stack keeps its database between starts, so the one-shot first reads the state the pool records (`--check` answers it as
    # replaces: none on the first start), then deploys expecting it
    image: eclipse-temurin:25.0.4.1_1-jre-noble
    profiles: ["deploy"]
    restart: "no"
    environment:
      RAIL8_TOKEN: "${RAIL8_TOKEN:-}"
      # the CLI sends plain HTTP to a host other than loopback, http://rail8:8081, only when told so: the stack's own network
      RAIL8_ADMIN_TLS: "off"
    volumes:
      - ../../platform/cli/target:/cli:ro
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$RAIL8_TOKEN" ] || { echo 'deploy: set RAIL8_TOKEN to the deploy account token that rail8 bootstrap wrote' >&2; exit 2; }
        jar=$$(ls /cli/rail8-cli-*.jar | grep -v -E -- '-(sources|javadoc|tests)[.]jar$$' | head -n 1)
        check=$$(java -jar "$$jar" deploy rail8 HEAD --check --admin http://rail8:8081) || { printf '%s\n' "$$check"; exit 1; }
        replaces=$$(printf '%s' "$$check" | sed -n 's/.*"replaces":"\([0-9a-z]*\)".*/\1/p')
        exec java -jar "$$jar" deploy rail8 HEAD --expect "$$replaces" --admin http://rail8:8081
    depends_on:
      rail8:
        condition: service_healthy

  clickhouse:
    # history store of a later phase; present, not wired, started only with --profile history
    image: clickhouse/clickhouse-server:25.8.33.6
    profiles: ["history"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 40

volumes:
  pg-data:
  rail8-data:
  sftp-hostkeys:
  sftp-fingerprint:
  sftp-data:
  clickhouse-data:
